<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能任务管理系统</title>
    <style>
        *{box-sizing: border-box;font-family:"Microsoft Yahei",sans-serif;margin:0;padding:0;}
        body{max-width:700px;margin:30px auto;padding:0 20px;background:#f5f7fa;}
        h1{text-align:center;margin-bottom:24px;color:#2c3e50;}
        .box{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 12px #00000014;margin-bottom:20px;}
        .row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
        input{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:15px;}
        select{padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:15px;min-width:90px;}
        button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;}
        .btn-add{background:#2774e9;color:white;}
        .task-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap;}
        .task-title{flex:1;font-size:15px;}
        .done{text-decoration:line-through;color:#999;}
        .tag{font-size:12px;padding:2px 8px;border-radius:4px;}
        .tag-high{background:#ffe9e9;color:#d63031;}
        .tag-mid{background:#fff6e0;color:#e17000;}
        .tag-low{background:#e8f7ee;color:#009447;}
        .btn-toggle{background:#42b983;color:white;}
        .btn-del{background:#eb4d4b;color:white;}
    </style>
</head>
<body>
    <h1>智能任务管理系统</h1>
    <div class="box">
        <div class="row">
            <input id="taskInput" placeholder="请输入任务标题">
            <select id="prioritySelect">
                <option value="高">高</option>
                <option value="中" selected>中</option>
                <option value="低">低</option>
            </select>
            <button class="btn-add" onclick="addTask()">添加任务</button>
        </div>
        <div class="row">
            <span>筛选优先级：</span>
            <select id="filterSelect" onchange="loadTasks()">
                <option value="全部">全部</option>
                <option value="高">高</option>
                <option value="中">中</option>
                <option value="低">低</option>
            </select>
        </div>
    </div>
    <div class="box" id="taskList"></div>

<script>
async function loadTasks(){
    const filter = document.getElementById('filterSelect').value;
    const res = await fetch(`/api/tasks?filter=${encodeURIComponent(filter)}`);
    const json = await res.json();
    render(json.data);
}

function render(list){
    const dom = document.getElementById('taskList');
    dom.innerHTML = '';
    if(!list || list.length===0){
        dom.innerHTML = "<div style='text-align:center;color:#888;padding:20px'>暂无任务</div>";
        return;
    }
    list.forEach(item=>{
        const div = document.createElement('div');
        div.className = 'task-item';
        let clsTag;
        if(item.priority==='高') clsTag='tag-high';
        else if(item.priority==='中') clsTag='tag-mid';
        else clsTag='tag-low';

        div.innerHTML = `
            <div class="task-title ${item.is_completed?'done':''}">${escapeHtml(item.title)}</div>
            <span class="tag ${clsTag}">${item.priority}</span>
            <button class="btn-toggle" onclick="toggle(${item.id},${!item.is_completed})">
                ${item.is_completed?'设未完成':'设完成'}
            </button>
            <button class="btn-del" onclick="del(${item.id})">删除</button>
        `;
        dom.appendChild(div);
    })
}

async function addTask(){
    const title = document.getElementById('taskInput').value.trim();
    const priority = document.getElementById('prioritySelect').value;
    if(!title){alert('任务标题不能为空');return;}
    await fetch('/api/tasks',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({title,priority})
    });
    document.getElementById('taskInput').value='';
    loadTasks();
}

async function toggle(id,val){
    await fetch(`/api/tasks/${id}`,{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({is_completed:val})
    })
    loadTasks();
}

async function del(id){
    if(!confirm('确定删除该任务？'))return;
    await fetch(`/api/tasks/${id}`,{method:'DELETE'});
    loadTasks();
}

function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.onload = loadTasks;
</script>
</body>
</html>
